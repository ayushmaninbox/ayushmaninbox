name: README build
on:
  push:
    branches:
      - main
  repository_dispatch:
    # Fired by the "notify-profile" workflow that other repos push on commit,
    # so the cards update instantly instead of waiting on a schedule.
    types: [contribution-push]
  schedule:
    # Fallback only: catches contributions the push trigger can't reach
    # (repos without the notifier, PRs/issues/reviews on repos we don't own)
    # and keeps the birthday-based age string fresh even on quiet days.
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: readme-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.ACCESS_TOKEN || secrets.GITHUB_TOKEN }}
      - name: Get Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: cache/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r cache/requirements.txt
      - name: Update the SVG cards
        env:
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USER_NAME: ${{ secrets.USER_NAME || github.repository_owner }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: python today.py
      - name: Commit and push changes
        env:
          GIT_AUTHOR_NAME: "Ayushman Mohapatra"
          GIT_AUTHOR_EMAIL: "ayushmanmohapatra895@gmail.com"
          GIT_COMMITTER_NAME: "Ayushman Mohapatra"
          GIT_COMMITTER_EMAIL: "ayushmanmohapatra895@gmail.com"
        run: |-
          git config --global user.email "ayushmanmohapatra895@gmail.com"
          git config --global user.name "Ayushman Mohapatra"
          git add -A
          git diff --staged --quiet || (git commit -m "Update README stats [skip ci]" && git pull --rebase && git push)

