name: README build
on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.ACCESS_TOKEN || secrets.GITHUB_TOKEN }}
      - name: Get Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: cache/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r cache/requirements.txt
      - name: Update the SVG cards
        env:
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USER_NAME: ${{ secrets.USER_NAME || github.repository_owner }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: python today.py
      - name: Commit and push changes
        env:
          GIT_AUTHOR_NAME: "Ayushman Mohapatra"
          GIT_AUTHOR_EMAIL: "ayushmanmohapatra895@gmail.com"
          GIT_COMMITTER_NAME: "Ayushman Mohapatra"
          GIT_COMMITTER_EMAIL: "ayushmanmohapatra895@gmail.com"
        run: |-
          git config --global user.email "ayushmanmohapatra895@gmail.com"
          git config --global user.name "Ayushman Mohapatra"
          git add -A
          git diff --staged --quiet || (git commit -m "Update README stats [skip ci]" && git push)

